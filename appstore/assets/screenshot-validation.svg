<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1923"/>
      <stop offset="100%" stop-color="#1A2A3A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" fill="url(#vbg)"/>

  <!-- Terminal chrome -->
  <rect x="40" y="30" width="720" height="440" rx="8" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
  <circle cx="65" cy="50" r="6" fill="#FF5F57"/>
  <circle cx="85" cy="50" r="6" fill="#FEBC2E"/>
  <circle cx="105" cy="50" r="6" fill="#28C840"/>
  <text x="400" y="54" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">lumis — validation rule matching</text>

  <text x="70" y="90" font-family="monospace" font-size="13" fill="#4FC3F7">$ run_validation --symptom "users cannot submit sample orders"</text>

  <!-- Matched rules -->
  <text x="70" y="125" font-family="monospace" font-size="13" font-weight="bold" fill="#fff">3 validation rules matched</text>

  <!-- Rule 1 -->
  <rect x="70" y="140" width="660" height="85" rx="6" fill="#1A2A3A"/>
  <text x="90" y="163" font-family="monospace" font-size="12" font-weight="bold" fill="#FF5252">RULE VAL-SM-001  |  Confidence: 92%</text>
  <text x="90" y="183" font-family="monospace" font-size="11" fill="#aaa">Sample order submission requires valid sample allocation</text>
  <text x="90" y="203" font-family="monospace" font-size="11" fill="#66BB6A">Check: Verify sample allocation exists and has remaining quantity &gt; 0</text>
  <text x="90" y="218" font-family="monospace" font-size="10" fill="#4FC3F7">Fix: Admin → Sample Allocation → Create/adjust allocation for the product</text>

  <!-- Rule 2 -->
  <rect x="70" y="235" width="660" height="85" rx="6" fill="#1A2A3A"/>
  <text x="90" y="258" font-family="monospace" font-size="12" font-weight="bold" fill="#FF9800">RULE VAL-SM-003  |  Confidence: 78%</text>
  <text x="90" y="278" font-family="monospace" font-size="11" fill="#aaa">Sample limit exceeded for current period</text>
  <text x="90" y="298" font-family="monospace" font-size="11" fill="#66BB6A">Check: Compare submitted quantity against per-account sample limits</text>
  <text x="90" y="313" font-family="monospace" font-size="10" fill="#4FC3F7">Fix: Review sample limit configuration for the product + territory</text>

  <!-- Rule 3 -->
  <rect x="70" y="330" width="660" height="85" rx="6" fill="#1A2A3A"/>
  <text x="90" y="353" font-family="monospace" font-size="12" font-weight="bold" fill="#FF9800">RULE VAL-SM-007  |  Confidence: 65%</text>
  <text x="90" y="373" font-family="monospace" font-size="11" fill="#aaa">User missing required license or permission set</text>
  <text x="90" y="393" font-family="monospace" font-size="11" fill="#66BB6A">Check: Verify SampleManagement permission set assigned to the user</text>
  <text x="90" y="408" font-family="monospace" font-size="10" fill="#4FC3F7">Fix: Setup → Permission Sets → Assign SampleManagement to the user</text>

  <!-- Footer -->
  <text x="70" y="445" font-family="monospace" font-size="11" fill="#666">Knowledge source: validation-rules/sample-management  |  Last updated: 2026-10-01</text>
</svg>
