<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1923"/>
      <stop offset="100%" stop-color="#1A2A3A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" fill="url(#dbg)"/>

  <!-- Terminal chrome -->
  <rect x="40" y="30" width="720" height="440" rx="8" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
  <circle cx="65" cy="50" r="6" fill="#FF5F57"/>
  <circle cx="85" cy="50" r="6" fill="#FEBC2E"/>
  <circle cx="105" cy="50" r="6" fill="#28C840"/>
  <text x="400" y="54" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">lumis — module selection decision tree</text>

  <text x="70" y="90" font-family="monospace" font-size="13" fill="#4FC3F7">$ traverse_decision_tree module-selection</text>

  <!-- Decision tree visualization -->
  <!-- Root -->
  <rect x="310" y="110" width="180" height="35" rx="6" fill="#4FC3F7" opacity="0.2" stroke="#4FC3F7" stroke-width="1"/>
  <text x="400" y="133" font-family="monospace" font-size="11" fill="#4FC3F7" text-anchor="middle">Content Distribution?</text>

  <!-- Branches -->
  <line x1="350" y1="145" x2="220" y2="180" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="145" x2="580" y2="180" stroke="#66BB6A" stroke-width="1" opacity="0.5"/>

  <text x="270" y="170" font-family="monospace" font-size="10" fill="#888">Yes</text>
  <text x="520" y="170" font-family="monospace" font-size="10" fill="#888">No</text>

  <!-- Left branch -->
  <rect x="130" y="180" width="180" height="35" rx="6" fill="#4FC3F7" opacity="0.2" stroke="#4FC3F7" stroke-width="1"/>
  <text x="220" y="203" font-family="monospace" font-size="11" fill="#4FC3F7" text-anchor="middle">Regulatory Content?</text>

  <!-- Right branch -->
  <rect x="490" y="180" width="180" height="35" rx="6" fill="#66BB6A" opacity="0.2" stroke="#66BB6A" stroke-width="1"/>
  <text x="580" y="203" font-family="monospace" font-size="11" fill="#66BB6A" text-anchor="middle">Sample Management?</text>

  <!-- Second level branches -->
  <line x1="180" y1="215" x2="120" y2="250" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="215" x2="320" y2="250" stroke="#66BB6A" stroke-width="1" opacity="0.5"/>
  <line x1="540" y1="215" x2="480" y2="250" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
  <line x1="620" y1="215" x2="680" y2="250" stroke="#66BB6A" stroke-width="1" opacity="0.5"/>

  <!-- Leaf nodes -->
  <rect x="50" y="250" width="140" height="30" rx="6" fill="#FF9800" opacity="0.2" stroke="#FF9800" stroke-width="1"/>
  <text x="120" y="270" font-family="monospace" font-size="10" fill="#FF9800" text-anchor="middle">Engage + PromoMats</text>

  <rect x="250" y="250" width="140" height="30" rx="6" fill="#66BB6A" opacity="0.2" stroke="#66BB6A" stroke-width="1"/>
  <text x="320" y="270" font-family="monospace" font-size="10" fill="#66BB6A" text-anchor="middle">Engage Standard</text>

  <rect x="410" y="250" width="140" height="30" rx="6" fill="#FF9800" opacity="0.2" stroke="#FF9800" stroke-width="1"/>
  <text x="480" y="270" font-family="monospace" font-size="10" fill="#FF9800" text-anchor="middle">Sample Mgmt + Lots</text>

  <rect x="610" y="250" width="140" height="30" rx="6" fill="#66BB6A" opacity="0.2" stroke="#66BB6A" stroke-width="1"/>
  <text x="680" y="270" font-family="monospace" font-size="10" fill="#66BB6A" text-anchor="middle">Events Only</text>

  <!-- Recommendation box -->
  <rect x="70" y="310" width="660" height="140" rx="8" fill="#1A2A3A" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
  <text x="90" y="340" font-family="monospace" font-size="13" font-weight="bold" fill="#4FC3F7">Recommendation: Engage Standard + Sample Management</text>
  <text x="90" y="370" font-family="monospace" font-size="11" fill="#aaa">Based on your inputs:</text>
  <text x="90" y="393" font-family="monospace" font-size="11" fill="#66BB6A">✓ No regulatory content approval workflow needed</text>
  <text x="90" y="413" font-family="monospace" font-size="11" fill="#66BB6A">✓ Sample management with lot tracking required</text>
  <text x="90" y="433" font-family="monospace" font-size="11" fill="#FF9800">⚠ Consider: Japan requires standalone sample wave</text>
</svg>
